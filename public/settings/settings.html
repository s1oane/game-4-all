<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LWHS Controller Programmer</title>

  <link href="styles.css" rel="stylesheet" />
  <script src="serial.js" defer></script>
</head>

<body>
  <div class="settings-shell">
    <header class="settings-header">
      <span class="settings-tag">settings</span>
      <h1 class="settings-title">Game4all Controller</h1>
      <p class="settings-subtitle">Button programmer</p>
      <a
        class="settings-help"
        href="https://docs.google.com/document/d/1QSZJnrDljeBYKt7U0zf2L2sHKXsr77lOqlJtAbiOk3o/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
      >
        Help Guide
      </a>
    </header>

    <div class="settings-illustration">
      <img src="/images/controller.png" alt="Game controller diagram" />
    </div>

    <section class="settings-grid">
      <article class="settings-card">
        <h2 class="settings-card__label">I</h2>
        <div id="I" class="settings-card__input" tabindex="0" role="button" aria-label="Button I mapping">
          Click to change output
        </div>
      </article>
      <article class="settings-card">
        <h2 class="settings-card__label">II</h2>
        <div id="II" class="settings-card__input" tabindex="0" role="button" aria-label="Button II mapping">
          Click to change output
        </div>
      </article>
      <article class="settings-card">
        <h2 class="settings-card__label">III</h2>
        <div id="III" class="settings-card__input" tabindex="0" role="button" aria-label="Button III mapping">
          Click to change output
        </div>
      </article>
      <article class="settings-card">
        <h2 class="settings-card__label">IV</h2>
        <div id="IV" class="settings-card__input" tabindex="0" role="button" aria-label="Button IV mapping">
          Click to change output
        </div>
      </article>
    </section>

    <div class="settings-actions">
      <button type="button" class="settings-button settings-button--ghost" id="reset">
        Reset
      </button>
      <button type="button" class="settings-button" id="save">
        Save
      </button>
    </div>
  </div>
  <script src="main.js"></script>
</body>

</html>
